<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Day Out | Guernsey Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body class="map-page">
<main>
  <h1>Plan a day out</h1>
  <p class="dayout-hint">Tap anywhere on the map to drop a pin, or pick a place below, then adjust the radius to see what's nearby.</p>
  <div id="map"></div>
  <div class="dayout-form">
    <div>
      <label for="anchor">Start near</label>
      <select id="anchor"></select>
    </div>
    <div>
      <label for="radius">Search radius <span class="range-value" id="radiusValue">4 km</span></label>
      <input type="range" id="radius" min="1" max="10" value="4">
    </div>
    <button id="go">Find a cluster</button>
  </div>
  <div id="results"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="nav.js"></script>
<script src="data.js"></script>
<script src="dayout.js"></script>
<script>renderHeader('dayout');</script>
</body>
</html>
